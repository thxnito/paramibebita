<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Jael :3</title>
    
    <!-- ========================================== -->
    <!-- ESTILOS (CSS)                              -->
    <!-- ========================================== -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg-color: #202028;
            --box-bg: #2d1b2e;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Press Start 2P', cursive;
            overflow: hidden;
        }

        /* Consola estilo GameBoy */
        .game-boy {
            background-color: #c0c0c0;
            padding: 20px 20px 40px 20px;
            border-radius: 10px 10px 40px 10px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .screen-border {
            background-color: #555;
            padding: 30px 30px 10px 30px;
            border-radius: 10px 10px 30px 10px;
        }

        .screen {
            width: 320px; /* Un poco más ancha para el personaje */
            height: 260px;
            /* Un fondo nocturno un poco más dramático */
            background: linear-gradient(to bottom, #020111, #191644, #332f63);
            border: 4px solid #000;
            position: relative;
            overflow: hidden;
            image-rendering: pixelated; /* Crucial para que todo se vea retro */
        }

        /* Elementos del cielo */
        .stars {
            width: 2px;
            height: 2px;
            background: white;
            position: absolute;
            top: 20px;
            left: 30px;
            box-shadow: 
                50px 30px white, 
                100px 80px white, 
                200px 10px white, 
                280px 40px white,
                150px 120px white,
                250px 50px white;
            animation: twinkle 3s infinite;
        }

        .moon {
            width: 30px;
            height: 30px;
            background-color: #f4f4f4;
            border-radius: 50%;
            position: absolute;
            top: 20px;
            right: 20px;
            box-shadow: 0 0 8px #fff, inset -5px -5px 0px #ddd;
        }

        /* EL PERSONAJE */
        .character-sprite {
            position: absolute;
            bottom: 85px; /* Posicionado justo encima de la caja de texto */
            left: 50%;
            transform: translateX(-50%); /* Centrado horizontalmente */
            width: 100px; /* Ajusté el tamaño para que se vea imponente */
            height: 120px;
            /* Usamos la URL de tu imagen */
            background-image: url('https://i.postimg.cc/QN4QPW9w/7b436ae908a80aa2b8ad2705a5a4e4f5.gif');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center bottom;
            image-rendering: pixelated; /* Asegura que no se vea borroso */
            z-index: 10;
        }

        /* Caja de Texto RPG */
        .dialogue-box {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            height: 65px;
            background-color: var(--box-bg);
            border: 3px solid #fff;
            border-radius: 4px;
            padding: 10px 15px;
            color: #fff;
            font-size: 10px; /* Letra un poco más pequeña para que quepa mejor */
            line-height: 1.6;
            box-shadow: 0 0 0 3px #000 inset; /* Borde interno doble para más estilo retro */
            z-index: 20;
        }

        .blinking-cursor {
            position: absolute;
            bottom: 8px;
            right: 10px;
            color: #fff;
            animation: blink 0.8s infinite;
            display: none; /* Se muestra al terminar de escribir */
        }

        .brand {
            color: #777;
            margin-top: 8px;
            font-size: 10px;
            font-weight: bold;
            text-align: right;
            font-family: sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .instruction {
            color: #888;
            font-size: 10px;
            margin-top: 20px;
            font-family: sans-serif;
        }

        /* Animaciones */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- ESTRUCTURA (HTML)                          -->
    <!-- ========================================== -->
    <div class="game-boy">
        <div class="screen-border">
            <div class="screen">
                <div class="sky">
                    <div class="stars"></div>
                    <div class="moon"></div>
                </div>
                
                <div class="scene">
                    <div class="character-sprite"></div>
                </div>

                <div class="dialogue-box" id="dialogue-box">
                    <p id="text-display"></p>
                    <span class="blinking-cursor">~</span>
                </div>
            </div>
            <div class="brand">NINTENDO DE TEMU</div>
        </div>
    </div>
    <p class="instruction">Haz clic en la pantalla para avanzar el texto</p>

    <!-- ========================================== -->
    <!-- LÓGICA (JAVASCRIPT)                        -->
    <!-- ========================================== -->
    <script>
        const storyLines = [
            "HOLA JAEL <3",
            "TE QUIERO DECIR POR MEDIO DE ESTE MENSAJE",
            "QUE ERES MUY ESPECIAL PARA MÍ",
            "Y QUE ME HACES MUY FELIZ",
            "CADA MOMENTO QUE PASO CONTIGO",
            "ES UN TESORO QUE GUARDO EN MI CORAZÓN",
            "GRACIAS POR SER TAN INCREÍBLE",
            "Y POR HACERME SONREÍR CADA DÍA",
            "ESPERO QUE LO NUESTRO SIGA CRECIENDO",
            "Y QUE JUNTOS CREAMOS MUCHOS RECUERDOS MÁS",
            "TE QUIERO MUCHO, JAEL <3",
            "ESPERO QUE TE GUSTE ESTE MENSAJE <3",
            "GRACIAS POR SER PARTE DE MI VIDA",
            "Y POR HACERME SENTIR TAN ESPECIAL",
            "TE ADORO TANTO, JAEL <3",
            "SI PUDIERA TE DARIA MIS OJOS",
            "PARA QUE VEAS LO HERMOSA QUE ESTAS Y LO MUCHO QUE ME ENCANATAS",
            "TE QUIERO, ME ENCANTAS, ME FACINAS, TE ADORO",
            "BYE <3"
           
        ];

        const textDisplay = document.getElementById("text-display");
        const dialogueBox = document.getElementById("dialogue-box");
        const cursor = document.querySelector(".blinking-cursor");

        let currentLine = 0;
        let charIndex = 0;
        let isTyping = false;

        function typeWriter(text) {
            if (charIndex < text.length) {
                isTyping = true;
                textDisplay.innerHTML += text.charAt(charIndex);
                charIndex++;
                setTimeout(() => typeWriter(text), 60); // Velocidad de escritura
                cursor.style.display = 'none';
            } else {
                isTyping = false;
                cursor.style.display = 'block'; // Mostrar cursor al terminar
            }
        }

        function nextLine() {
            if (isTyping) return; // Evitar saltar si aún está escribiendo

            if (currentLine < storyLines.length) {
                textDisplay.innerHTML = "";
                charIndex = 0;
                typeWriter(storyLines[currentLine]);
                currentLine++;
            } else {
                // Final del mensaje
                cursor.style.display = 'none';
            }
        }

        // Iniciar el primer texto al cargar
        window.onload = () => {
            setTimeout(nextLine, 500);
        };

        // Avanzar al hacer clic en la consola completa
        document.querySelector(".game-boy").addEventListener("click", nextLine);
    </script>

</body>
</html>
